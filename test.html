(()=>{'use strict';const $=id=>document.getElementById(id),surface=$('surface'),ink=$('ink'),live=$('live'),ctx=ink.getContext('2d'),ov=live.getContext('2d');let history=[],redo=[],active=null,tool='pen',color='#202124',dpr=1,raf=0,queue=[],dirty=null;const mid=(a,b)=>({x:(a.x+b.x)/2,y:(a.y+b.y)/2}),dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
